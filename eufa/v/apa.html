<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DASH Web Player with License Refresh</title>
    <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
</head>
<body>
    <h1>DASH Web Player</h1>
    <video id="videoPlayer" controls width="640" height="360"></video>

    <script>
        // URL MPD file DASH
        var mpdUrl = 'https://d2xz2v5wuvgur6.cloudfront.net/out/v1/997ce8767b604fae9fce05379b3b8b3a/index.mpd';  // Ganti dengan URL file MPD Anda

        // Fungsi untuk mengambil URL lisensi terbaru (token)
        function fetchLicenseUrl() {
            // Gunakan logika Anda untuk mendapatkan token lisensi terbaru
            var licenseToken = "eyJhbGciOiJIUzI1NiIsImtpZCI6IjE5NThjYTMxLWMzNGMtNDAxNC04ZGM1LTVkY2MwMDBjMTU5OCIsInR5cCI6IkpXVCJ9.eyJjaWQiOiIwMDAwMDAwMDAwMDAwMDAwMDAwMSIsImNvdW50IjowLCJjdHAiOiJMVFYiLCJkc2giOnRydWUsImV4cCI6MTcyNjg1MjkwNCwiZnBzIjpmYWxzZSwiaWF0IjoxNzI2ODQ3NTA0LCJpc3MiOiJhZGkiLCJqaWQiOiJkODlmYzFmYS1mMzgzLTQxN2YtODdhNi01MTM3ODI1MGJhZjIiLCJzdWIiOiJhbm9ueW1vdXMiLCJ2ZXIiOjF9.ImNPFudDRqPLiuo61ZKh8svMvoMfyBm7M90hU9sSu6Y";
            var licenseUrl = "https://adi.visionplus.id/v1/play/refresh-drm?token=" + licenseToken;
            return licenseUrl;
        }

        // Inisialisasi dash.js player
        var player = dashjs.MediaPlayer().create();
        player.initialize(document.querySelector("#videoPlayer"), mpdUrl, true);

        // Menambahkan metode akuisisi lisensi
        player.setProtectionData({
            "com.widevine.alpha": {
                serverURL: fetchLicenseUrl()
            },
            "com.microsoft.playready": {
                serverURL: fetchLicenseUrl()
            }
        });

        // Setel interval untuk memperbarui URL lisensi setiap 10 menit
        setInterval(() => {
            player.setProtectionData({
                "com.widevine.alpha": {
                    serverURL: fetchLicenseUrl()
                },
                "com.microsoft.playready": {
                    serverURL: fetchLicenseUrl()
                }
            });
        }, 600000);  // Refresh setiap 10 menit
    </script>
</body>
</html>
