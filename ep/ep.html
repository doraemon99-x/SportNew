<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streaming TV - TipiStream</title>
    <style>
        * { margin:0; padding:0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            overflow-x: hidden;
        }
        
        .navbar { 
            background: linear-gradient(90deg, #0f3460 0%, #533483 100%);
            padding: 12px 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .navbar img {
            height: 55px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
            transition: transform 0.3s ease;
        }
        .navbar img:hover {
            transform: scale(1.05);
        }
        
        .container { 
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 12px;
            padding: 12px;
            height: calc(100vh - 79px);
            min-height: 600px;
        }
        
        .main-content { 
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #0f3460 0%, #1a1a2e 100%);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(83, 52, 131, 0.3);
            border: 2px solid #533483;
        }
        
        #player { 
            flex: 1;
            border: none;
            width: 100%;
            background: #000;
        }
        
        .running-trakteer {
            height: 50px;
            overflow: hidden;
            border-bottom: 2px solid #533483;
            background: rgba(83, 52, 131, 0.1);
        }
        .running-trakteer iframe {
            width: 100% !important;
            height: 50px !important;
            border: none !important;
            display: block !important;
            background: transparent;
        }
        
        .footer { 
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: rgba(15, 52, 96, 0.5);
            border-top: 1px solid #533483;
        }
        
        .jam { 
            background: linear-gradient(135deg, #533483 0%, #8e24aa 100%);
            color: #fff;
            padding: 8px 14px;
            font-weight: bold;
            border-radius: 6px;
            font-size: 0.9em;
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(83, 52, 131, 0.4);
        }
        
        .footer-running { 
            flex: 1;
            background: linear-gradient(90deg, #1a1a2e 0%, #0f3460 100%);
            border-radius: 6px;
            overflow: hidden;
            min-height: 40px;
            display: flex;
            align-items: center;
            border: 1px solid #533483;
        }
        
        .running-text-wrapper {
            display: flex;
            width: 100%;
            animation: scrollText 25s linear infinite;
        }
        
        .running-text-content {
            display: inline-flex;
            align-items: center;
            color: #fff;
            font-weight: 600;
            white-space: nowrap;
            padding: 0 30px;
            min-width: max-content;
        }
        
        @keyframes scrollText {
            0% {
                transform: translateX(100%);
            }
            100% {
                transform: translateX(-100%);
            }
        }
        
        .sidebar { 
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: linear-gradient(135deg, #0f3460 0%, #1a1a2e 100%);
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(83, 52, 131, 0.3);
            border: 2px solid #533483;
            overflow: hidden;
        }
        
        .toggle-buttons {
            display: flex;
            gap: 6px;
        }
        .toggle-btn {
            flex: 1;
            padding: 10px;
            background: linear-gradient(135deg, #533483 0%, #8e24aa 100%);
            border: 2px solid #8e24aa;
            border-radius: 6px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.85em;
        }
        .toggle-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(141, 68, 173, 0.4);
        }
        .toggle-btn.active {
            background: linear-gradient(135deg, #8e24aa 0%, #6a1b9a 100%);
            box-shadow: 0 8px 20px rgba(141, 68, 173, 0.6);
        }
        
        .channels-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            overflow-y: auto;
            padding-right: 6px;
        }
        .channels-container::-webkit-scrollbar {
            width: 6px;
        }
        .channels-container::-webkit-scrollbar-track {
            background: rgba(83, 52, 131, 0.1);
            border-radius: 3px;
        }
        .channels-container::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #533483 0%, #8e24aa 100%);
            border-radius: 3px;
        }
        
        .channels-container.hidden {
            display: none;
        }
        
        .chatbox-container {
            flex: 1;
            overflow: hidden;
            border-radius: 8px;
            background: #fff;
            border: 1px solid #533483;
        }
        .chatbox-container.hidden {
            display: none;
        }
        .chatbox-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .channel-category {
            padding: 10px;
            background: linear-gradient(135deg, #533483 0%, #8e24aa 100%);
            color: #fff;
            font-weight: 700;
            font-size: 0.95em;
            text-align: center;
            border-radius: 6px;
            cursor: default;
            user-select: none;
        }
        
        .channel-btn { 
            padding: 12px;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f3460 100%);
            border: 2px solid #533483;
            border-radius: 6px;
            color: #fff;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }
        .channel-btn:hover {
            background: linear-gradient(135deg, #0f3460 0%, #533483 100%);
            transform: translateX(4px);
            box-shadow: 0 4px 12px rgba(83, 52, 131, 0.3);
        }
        .channel-btn.active {
            background: linear-gradient(135deg, #533483 0%, #8e24aa 100%);
            box-shadow: 0 6px 16px rgba(141, 68, 173, 0.4);
        }
        
        /* RESPONSIVE - DESKTOP */
        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr 280px;
            }
        }
        
        /* RESPONSIVE - TABLET */
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto;
                height: auto;
                padding: 8px;
                gap: 8px;
            }
            
            .main-content {
                order: 1;
                min-height: 50vh;
            }
            
            .sidebar {
                order: 2;
                max-height: 300px;
            }
            
            /* CHANNELS DALAM GRID */
            .channels-container {
                display: flex;
                grid-template-columns: repeat(auto-fit, minmax(85px, 1fr));
                gap: 6px;
                flex: 1;
                overflow-y: auto;
                padding-right: 0;
            }
            
            .channel-category {
                grid-column: 1 / -1;
                padding: 8px;
                font-size: 0.9em;
                border-radius: 6px;
            }
            
            .channel-btn {
                padding: 8px;
                font-size: 0.8em;
                border-radius: 6px;
            }
        }
        
        /* RESPONSIVE - MOBILE (480px) */
        @media (max-width: 480px) {
            .navbar {
                padding: 8px 10px;
            }
            
            .navbar img {
                height: 42px;
            }
            
            .container {
                padding: 6px;
                gap: 6px;
            }
            
            .main-content {
                min-height: 42vh;
            }
            
            .sidebar {
                max-height: 260px;
                padding: 6px;
                gap: 6px;
            }
            
            .toggle-btn {
                font-size: 0.75em;
                padding: 6px;
            }
            
            /* CHANNELS DALAM GRID MOBILE */
            .channels-container {
                display: flex;
                grid-template-columns: repeat(auto-fit, minmax(75px, 1fr));
                gap: 5px;
                flex: 1;
                overflow-y: auto;
                padding-right: 0;
            }
            
            .channel-category {
                grid-column: 1 / -1;
                padding: 6px;
                font-size: 0.8em;
                border-radius: 4px;
            }
            
            .channel-btn {
                padding: 6px;
                font-size: 0.75em;
                border-radius: 4px;
            }
            
            .jam {
                font-size: 0.7em;
                padding: 4px 8px;
                border-radius: 4px;
            }
            
            .footer {
                gap: 4px;
                padding: 4px 6px;
            }
            
            .running-text-content {
                padding: 0 15px;
                font-size: 0.85em;
            }
        }
        
        /* RESPONSIVE - MOBILE EXTRA SMALL (360px) */
        @media (max-width: 360px) {
            .navbar {
                padding: 6px 8px;
            }
            
            .navbar img {
                height: 38px;
            }
            
            .container {
                padding: 4px;
                gap: 4px;
            }
            
            .main-content {
                min-height: 40vh;
            }
            
            .sidebar {
                max-height: 240px;
                padding: 4px;
                gap: 4px;
            }
            
            .toggle-btn {
                font-size: 0.7em;
                padding: 5px;
            }
            
            /* CHANNELS GRID 2 KOLOM */
            .channels-container {
                display: flex;
                grid-template-columns: repeat(2, 1fr);
                gap: 4px;
                flex: 1;
                overflow-y: auto;
                padding-right: 0;
            }
            
            .channel-category {
                grid-column: 1 / -1;
                padding: 5px 4px;
                font-size: 0.75em;
            }
            
            .channel-btn {
                padding: 5px;
                font-size: 0.7em;
                border-radius: 4px;
            }
            
            .jam {
                font-size: 0.65em;
                padding: 3px 6px;
            }
            
            .footer {
                gap: 3px;
                padding: 3px 4px;
            }
            
            .running-text-content {
                padding: 0 12px;
                font-size: 0.8em;
            }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <img src="/img/tipigaza.png" alt="TipiStream">
    </div>
    
    <div class="container">
        <div class="main-content">
            <iframe id="player" src="about:blank"></iframe>
            
            <div class="running-trakteer">
                <iframe 
                    title="Trakteer"
                    width="100%" 
                    style="border:none" 
                    src="https://stream.trakteer.id/running-text/index.html?rt_font=Chewy&rt_type=top-supporters&rt_count=10&rt_speed=slow&rt_theme=ramadhan&rt_interval=90&rt_messages=Ayo+dukung+terus+%7Busername%7D+di+%7Btrlink%7D+dan+beri+semangat+Tim+Kebanggaanmu...&rt_show_link=false&rt_txtshadow=true&creator_name=Tipistream&page_url=trakteer.id%2FTipistream%2Fgift&mod=3&key=trstream-yvOAUf9Z6t5e7jt9qBUw&hash=zb8r4zrrg6v569an&timestamp=1761836238"
                    sandbox="allow-same-origin allow-scripts allow-popups">
                </iframe>
            </div>
            
            <div class="footer">
                <div class="jam" id="jamWIB">JAM (WIB): --:--</div>
                <div class="footer-running">
                    <div class="running-text-wrapper" id="runningWrapper">
                        <div class="running-text-content">
                            🎉 Selamat datang di TipiStream - Streaming berkualitas tinggi untuk Anda!
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="sidebar">
            <div class="toggle-buttons">
                <button class="toggle-btn active" onclick="toggleView('channels')">📺 Channels</button>
                <button class="toggle-btn" onclick="toggleView('chat')">💬 Chat</button>
            </div>
            
            <div class="channels-container" id="channelsContainer">
                
                <div class="channel-btn" onclick="loadChannel(this, 'A', '/op/ep/crt1')">CH 1</div>
                <div class="channel-btn" onclick="loadChannel(this, 'B', '/op/ep/crt2')">CH 2</div>
                <div class="channel-btn" onclick="loadChannel(this, 'C', '/op/ep/crt3')">CH 3</div>
                <div class="channel-btn" onclick="loadChannel(this, 'D', '/op/ep/crt4')">CH 4</div>
            </div>
            
            <div class="chatbox-container hidden" id="chatboxContainer">
                <iframe 
                    title="Chat Box"
                    src="https://www5.cbox.ws/box/?boxid=940426&boxtag=rSDm0Y"
                    sandbox="allow-same-origin allow-scripts allow-popups allow-pointer-lock allow-forms">
                </iframe>
            </div>
        </div>
    </div>

    <script>
        function setupRunningText() {
            const wrapper = document.getElementById('runningWrapper');
            const textContent = wrapper.querySelector('.running-text-content');
            
            if (textContent) {
                const clone1 = textContent.cloneNode(true);
                const clone2 = textContent.cloneNode(true);
                
                wrapper.appendChild(clone1);
                wrapper.appendChild(clone2);
            }
        }
        
        setupRunningText();

        function updateJam() {
            const jamEl = document.getElementById("jamWIB");
            const now = new Date();
            const wibTime = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Jakarta' }));
            const jam = wibTime.toLocaleTimeString("id-ID", {
                hour:'2-digit', 
                minute:'2-digit',
                hour12: false
            });
            jamEl.textContent = "JAM (WIB): " + jam;
        }
        setInterval(updateJam, 1000);
        updateJam();

        function toggleView(view) {
            const channelsContainer = document.getElementById('channelsContainer');
            const chatboxContainer = document.getElementById('chatboxContainer');
            const toggleBtns = document.querySelectorAll('.toggle-btn');
            
            toggleBtns.forEach(btn => btn.classList.remove('active'));
            
            if (view === 'channels') {
                channelsContainer.classList.remove('hidden');
                chatboxContainer.classList.add('hidden');
                toggleBtns[0].classList.add('active');
            } else if (view === 'chat') {
                channelsContainer.classList.add('hidden');
                chatboxContainer.classList.remove('hidden');
                toggleBtns[1].classList.add('active');
            }
        }

        function loadChannel(element, channel, url) {
            document.querySelectorAll('.channel-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            element.classList.add('active');
            document.getElementById("player").src = url;
            console.log('Channel ' + channel + ' dimuat dari: ' + url);
        }

        function updateRunningText(newText) {
            const wrapper = document.getElementById('runningWrapper');
            wrapper.innerHTML = `
                <div class="running-text-content">${newText}</div>
                <div class="running-text-content">${newText}</div>
                <div class="running-text-content">${newText}</div>
            `;
        }

        function setRunningTextSpeed(speed) {
            const wrapper = document.getElementById('runningWrapper');
            wrapper.style.animation = `scrollText ${speed}s linear infinite`;
        }
    </script>
</body>
</html>
