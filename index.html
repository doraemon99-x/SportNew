<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streaming TV - TipiStream</title>
    <style>
        * { margin:0; padding:0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            overflow-x: hidden;
        }
        
        .navbar { 
            background: linear-gradient(90deg, #0f3460 0%, #533483 100%);
            padding: 12px 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            gap: 15px;
        }
        
        .navbar-content {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .navbar img {
            height: 55px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
            transition: transform 0.3s ease;
            cursor: pointer;
        }
        .navbar img:hover {
            transform: scale(1.05);
        }
        
        .home-btn {
            background: linear-gradient(135deg, #8e24aa 0%, #533483 100%);
            color: #fff;
            border: 2px solid #8e24aa;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        .home-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(141, 68, 173, 0.4);
        }
        .home-btn:active {
            background: linear-gradient(135deg, #6a1b9a 0%, #533483 100%);
            box-shadow: 0 8px 20px rgba(141, 68, 173, 0.6);
        }
        
        /* TRAKTEER BUTTON STYLING */
        .trakteer-container {
            display: flex;
            align-items: center;
        }
        
        #trbtn-container-0 .trbtn-img {
            display: initial !important;
            vertical-align: middle;
            padding-top: 0 !important;
            padding-bottom: 0 !important;
            border: none;
            margin-top: 0;
            margin-right: 10px !important;
            margin-left: 0 !important;
            margin-bottom: 3px !important;
        }
        
        .trbtn-container {
            display: inline-block !important;
            white-space: nowrap;
            min-width: 110px;
        }
        
        span.trbtn-txt {
            color: #fff !important;
            letter-spacing: -0.15px !important;
            text-wrap: none;
            vertical-align: middle;
            line-height: 33px !important;
            padding: 0;
            text-align: center;
            text-decoration: none !important;
            text-shadow: 0 1px 1px rgba(34, 34, 34, 0.05);
        }
        
        .trbtn-txt a {
            color: #fff !important;
            text-decoration: none !important;
        }
        
        .trbtn-txt a:hover {
            color: #fff !important;
            text-decoration: none;
        }
        
        a.trbtn {
            box-shadow: 1px 1px 0px rgba(0, 0, 0, 0.2);
            line-height: 36px !important;
            min-width: 100px;
            display: inline-block !important;
            background-color: #be1e2d;
            padding: 2px 24px !important;
            text-align: center !important;
            border-radius: 9999px;
            color: #fff;
            cursor: pointer;
            overflow-wrap: break-word;
            vertical-align: middle;
            border: 0 none #fff !important;
            font-family: 'Quicksand', Helvetica, Century Gothic, sans-serif !important;
            text-decoration: none;
            text-shadow: none;
            font-weight: 700 !important;
            font-size: 14px !important;
        }
        
        a.trbtn:visited {
            color: #fff !important;
            text-decoration: none !important;
        }
        
        a.trbtn:hover {
            opacity: .85;
            color: #f5f5f5 !important;
            text-decoration: none !important;
        }
        
        a.trbtn:active {
            color: #f5f5f5 !important;
            text-decoration: none !important;
        }
        
        .trbtn-txt img.trbtn-img {
            display: initial;
            animation: trbtn-wiggle 3s infinite;
            height: 22px;
        }
        
        @keyframes trbtn-wiggle {
            0% { transform: rotate(0) scale(1); }
            60% { transform: rotate(0) scale(1); }
            75% { transform: rotate(0) scale(1.12); }
            80% { transform: rotate(0) scale(1.1); }
            84% { transform: rotate(-10deg) scale(1.1); }
            88% { transform: rotate(10deg) scale(1.1); }
            92% { transform: rotate(-10deg) scale(1.1); }
            96% { transform: rotate(10deg) scale(1.1); }
            100% { transform: rotate(0) scale(1); }
        }
        
        .container { 
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 12px;
            padding: 12px;
            min-height: calc(100vh - 79px);
        }
        
        .main-content { 
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #0f3460 0%, #1a1a2e 100%);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(83, 52, 131, 0.3);
            border: 2px solid #533483;
            height: fit-content;
        }
        
        #player { 
            width: 100%;
            height: 60vh;
            min-height: 400px;
            border: none;
            background: #000;
        }
        
        .running-trakteer {
            height: 50px;
            overflow: hidden;
            border-bottom: 2px solid #533483;
            background: rgba(83, 52, 131, 0.1);
        }
        .running-trakteer iframe {
            width: 100% !important;
            height: 50px !important;
            border: none !important;
            display: block !important;
            background: transparent;
        }
        
        .footer { 
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: rgba(15, 52, 96, 0.5);
            border-top: 1px solid #533483;
        }
        
        .jam { 
            background: linear-gradient(135deg, #533483 0%, #8e24aa 100%);
            color: #fff;
            padding: 8px 14px;
            font-weight: bold;
            border-radius: 6px;
            font-size: 0.9em;
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(83, 52, 131, 0.4);
        }
        
        .footer-running { 
            flex: 1;
            background: linear-gradient(90deg, #1a1a2e 0%, #0f3460 100%);
            border-radius: 6px;
            overflow: hidden;
            min-height: 40px;
            display: flex;
            align-items: center;
            border: 1px solid #533483;
        }
        
        .running-text-wrapper {
            display: flex;
            width: 100%;
            animation: scrollText 25s linear infinite;
        }
        
        .running-text-content {
            display: inline-flex;
            align-items: center;
            color: #fff;
            font-weight: 600;
            white-space: nowrap;
            padding: 0 30px;
            min-width: max-content;
        }
        
        @keyframes scrollText {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        
        .sidebar { 
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: linear-gradient(135deg, #0f3460 0%, #1a1a2e 100%);
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(83, 52, 131, 0.3);
            border: 2px solid #533483;
            height: fit-content;
            max-height: calc(100vh - 103px);
            overflow: hidden;
        }
        
        .toggle-buttons {
            display: flex;
            gap: 6px;
        }
        .toggle-btn {
            flex: 1;
            padding: 10px;
            background: linear-gradient(135deg, #533483 0%, #8e24aa 100%);
            border: 2px solid #8e24aa;
            border-radius: 6px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.85em;
        }
        .toggle-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(141, 68, 173, 0.4);
        }
        .toggle-btn.active {
            background: linear-gradient(135deg, #8e24aa 0%, #6a1b9a 100%);
            box-shadow: 0 8px 20px rgba(141, 68, 173, 0.6);
        }
        
        .categories-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            overflow-y: auto;
            padding-right: 6px;
        }
        .categories-container::-webkit-scrollbar {
            width: 6px;
        }
        .categories-container::-webkit-scrollbar-track {
            background: rgba(83, 52, 131, 0.1);
            border-radius: 3px;
        }
        .categories-container::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #533483 0%, #8e24aa 100%);
            border-radius: 3px;
        }
        .categories-container.hidden {
            display: none;
        }
        
        .chatbox-container {
            flex: 1;
            overflow: hidden;
            border-radius: 8px;
            background: #fff;
            border: 1px solid #533483;
        }
        .chatbox-container.hidden {
            display: none;
        }
        .chatbox-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .channel-category {
            padding: 10px;
            background: linear-gradient(135deg, #533483 0%, #8e24aa 100%);
            color: #fff;
            font-weight: 700;
            font-size: 0.95em;
            text-align: center;
            border-radius: 6px;
            cursor: default;
            user-select: none;
        }
        
        .category-btn {
            padding: 12px;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f3460 100%);
            border: 2px solid #533483;
            border-radius: 6px;
            color: #fff;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            text-decoration: none;
            display: block;
        }
        .category-btn:hover {
            background: linear-gradient(135deg, #0f3460 0%, #533483 100%);
            transform: translateX(4px);
            box-shadow: 0 4px 12px rgba(83, 52, 131, 0.3);
        }
        .category-btn:active {
            background: linear-gradient(135deg, #533483 0%, #8e24aa 100%);
            box-shadow: 0 6px 16px rgba(141, 68, 173, 0.4);
        }
        
        /* ADSTERRA NATIVE BANNER - PALING BAWAH */
        .bottom-ad-container {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #0f3460 0%, #1a1a2e 100%);
            border-top: 2px solid #533483;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 150px;
            margin-top: 12px;
        }
        
        #container-574e0aac9784269f4b996189aeaa3e52 {
            width: 100%;
            max-width: 100%;
        }
        
        /* RESPONSIVE */
        @media (max-width: 1024px) {
            .container { grid-template-columns: 1fr 280px; }
        }
        
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                gap: 8px;
                padding: 8px;
            }
            
            .main-content { order: 1; }
            
            #player {
                height: 50vh;
                min-height: 300px;
            }
            
            .sidebar { order: 2; max-height: 300px; }
            
            .categories-container {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(85px, 1fr));
                gap: 6px;
                flex: 1;
                overflow-y: auto;
                padding-right: 0;
            }
            
            .channel-category {
                grid-column: 1 / -1;
                padding: 8px;
                font-size: 0.9em;
                border-radius: 6px;
            }
            
            .category-btn {
                padding: 8px;
                font-size: 0.8em;
                border-radius: 6px;
            }
            
            .navbar {
                flex-wrap: wrap;
            }
            
            .navbar-content {
                gap: 10px;
                width: 100%;
            }
            
            .home-btn {
                font-size: 0.85em;
                padding: 8px 12px;
            }
            
            a.trbtn {
                font-size: 12px !important;
                padding: 2px 16px !important;
            }
            
            .bottom-ad-container {
                padding: 12px;
                min-height: 120px;
            }
        }
        
        @media (max-width: 480px) {
            .navbar {
                padding: 8px 10px;
                flex-wrap: wrap;
                gap: 6px;
            }
            
            .navbar-content {
                gap: 8px;
                width: 100%;
                flex-wrap: wrap;
            }
            
            .navbar img {
                height: 42px;
            }
            
            .home-btn {
                font-size: 0.7em;
                padding: 6px 10px;
                flex: 1;
                min-width: 70px;
            }
            
            .trakteer-container {
                width: 100%;
                justify-content: center;
            }
            
            a.trbtn {
                font-size: 11px !important;
                padding: 2px 12px !important;
                min-width: auto;
            }
            
            .container {
                padding: 6px;
                gap: 6px;
            }
            
            #player {
                height: 42vh;
                min-height: 250px;
            }
            
            .sidebar {
                max-height: 260px;
                padding: 6px;
                gap: 6px;
            }
            
            .toggle-btn {
                font-size: 0.75em;
                padding: 6px;
            }
            
            .categories-container {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(75px, 1fr));
                gap: 5px;
                flex: 1;
                overflow-y: auto;
                padding-right: 0;
            }
            
            .channel-category {
                grid-column: 1 / -1;
                padding: 6px;
                font-size: 0.8em;
                border-radius: 4px;
            }
            
            .category-btn {
                padding: 6px;
                font-size: 0.75em;
                border-radius: 4px;
            }
            
            .jam {
                font-size: 0.7em;
                padding: 4px 8px;
                border-radius: 4px;
            }
            
            .footer {
                gap: 4px;
                padding: 4px 6px;
            }
            
            .running-text-content {
                padding: 0 15px;
                font-size: 0.85em;
            }
            
            .bottom-ad-container {
                padding: 8px;
                min-height: 100px;
                margin-top: 6px;
            }
        }
        
        @media (max-width: 360px) {
            .navbar {
                padding: 6px 8px;
            }
            
            .navbar-content {
                flex-direction: column;
                width: 100%;
            }
            
            .navbar img {
                height: 38px;
            }
            
            .home-btn {
                font-size: 0.65em;
                padding: 5px 8px;
                width: 100%;
            }
            
            .trakteer-container {
                width: 100%;
            }
            
            a.trbtn {
                font-size: 10px !important;
                padding: 2px 10px !important;
                width: 100%;
            }
            
            .container {
                padding: 4px;
                gap: 4px;
            }
            
            #player {
                height: 40vh;
                min-height: 220px;
            }
            
            .sidebar {
                max-height: 240px;
                padding: 4px;
                gap: 4px;
            }
            
            .toggle-btn {
                font-size: 0.7em;
                padding: 5px;
            }
            
            .categories-container {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 4px;
                flex: 1;
                overflow-y: auto;
                padding-right: 0;
            }
            
            .channel-category {
                grid-column: 1 / -1;
                padding: 5px 4px;
                font-size: 0.75em;
            }
            
            .category-btn {
                padding: 5px;
                font-size: 0.7em;
                border-radius: 4px;
            }
            
            .jam {
                font-size: 0.65em;
                padding: 3px 6px;
            }
            
            .footer {
                gap: 3px;
                padding: 3px 4px;
            }
            
            .running-text-content {
                padding: 0 12px;
                font-size: 0.8em;
            }
            
            .bottom-ad-container {
                padding: 6px;
                min-height: 90px;
                margin-top: 4px;
            }
        }
    </style>

    <!-- ADSTERRA NATIVE BANNER SCRIPT -->
    <script async="async" data-cfasync="false" src="//pl28005532.effectivegatecpm.com/574e0aac9784269f4b996189aeaa3e52/invoke.js"></script>

    <script type='text/javascript'>
        (function(){
            var trbtnId = trbtn.init('Dukung Saya di Trakteer','#533483','https://trakteer.id/Tipistream','https://trakteer.id/images/mix/cendol.png','40');
            trbtn.draw(trbtnId);
        })();

        function setupRunningText() {
            const wrapper = document.getElementById('runningWrapper');
            const textContent = wrapper.querySelector('.running-text-content');
            
            if (textContent) {
                const clone1 = textContent.cloneNode(true);
                const clone2 = textContent.cloneNode(true);
                
                wrapper.appendChild(clone1);
                wrapper.appendChild(clone2);
            }
        }
        
        setupRunningText();

        function updateJam() {
            const jamEl = document.getElementById("jamWIB");
            const now = new Date();
            const wibTime = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Jakarta' }));
            const jam = wibTime.toLocaleTimeString("id-ID", {
                hour:'2-digit', 
                minute:'2-digit',
                hour12: false
            });
            jamEl.textContent = "JAM (WIB): " + jam;
        }
        setInterval(updateJam, 1000);
        updateJam();

        function toggleView(view) {
            const categoriesContainer = document.getElementById('categoriesContainer');
            const chatboxContainer = document.getElementById('chatboxContainer');
            const toggleBtns = document.querySelectorAll('.toggle-btn');
            
            toggleBtns.forEach(btn => btn.classList.remove('active'));
            
            if (view === 'categories') {
                categoriesContainer.classList.remove('hidden');
                chatboxContainer.classList.add('hidden');
                toggleBtns[0].classList.add('active');
            } else if (view === 'chat') {
                categoriesContainer.classList.add('hidden');
                chatboxContainer.classList.remove('hidden');
                toggleBtns[1].classList.add('active');
            }
        }

        function updateRunningText(newText) {
            const wrapper = document.getElementById('runningWrapper');
            wrapper.innerHTML = `
                <div class="running-text-content">${newText}</div>
                <div class="running-text-content">${newText}</div>
                <div class="running-text-content">${newText}</div>
            `;
        }

        function setRunningTextSpeed(speed) {
            const wrapper = document.getElementById('runningWrapper');
            wrapper.style.animation = `scrollText ${speed}s linear infinite`;
        }
    </script>
