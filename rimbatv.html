<!DOCTYPE html>
<html lang="id-ID" class="theme light classic">
<head>
    <meta charset="utf-8">
    <title>Daftar Harga Produk AditiaCloud</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="styles/vendor.css" rel="stylesheet">
    <link href="styles/main.css" rel="stylesheet">
    <link rel="icon" href="images/icon.png" sizes="192x192">
    <script>
        // Mencegah klik kanan pada gambar atau media lainnya
        document.addEventListener('contextmenu', function(e) {
            if (['IMG', 'IMAGE', 'VIDEO', 'SVG', 'PICTURE'].includes(e.target.tagName)) {
                e.preventDefault();
            }
        });
    </script>
</head>
<body>
    <!-- Header Halaman -->
    <header>
        <h1>Daftar Harga Produk AditiaCloud</h1>
    </header>

    <!-- Konten Daftar Harga -->
    <main>
        <section>
            <h2>Produk Dedicated Storage</h2>
            <ul>
                <li>Dedicated 100GB - Rp.150.000 / Tahun</li>
                <li>Dedicated 200GB - Rp.250.000 / Tahun</li>
                <li>Dedicated 2TB - Rp.500.000 / Tahun</li>
            </ul>
        </section>

        <section>
            <h2>Paket Office 365</h2>
            <ul>
                <li>Personal 1TB - Rp.350.000 / Tahun</li>
                <li>Family 6TB - Rp.500.000 / Tahun</li>
            </ul>
        </section>
    </main>

    <!-- JavaScript untuk Pengaturan Tema -->
    <script>
        document.documentElement.classList.replace('light', 
            window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    </script>
</body>
</html>
