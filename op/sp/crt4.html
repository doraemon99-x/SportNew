<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HLS Player Embed</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    .plyr {
      width: 100%;
      height: 100%;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain; /* ✅ Video tidak terpotong */
      background: #000;
    }
  </style>
</head>
<body>

<video id="player" playsinline></video>

<script type="application/json" id="embed-config">{
  "autoplay": true,
  "muted": false,
  "hidecontrols": false
}</script>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const config = JSON.parse(document.getElementById("embed-config").textContent);
  const video = document.getElementById("player");
  const streamURL = "https://vid.tipiku.biz.id/sp1.m3u8"; // GANTI STREAM KAMU

  const plyrOptions = {
    controls: config.hidecontrols ? [] : ['play-large','play','progress','current-time','mute','volume','fullscreen'],
    muted: config.muted
  };

  const player = new Plyr(video, plyrOptions);

  if (Hls.isSupported()) {
    const hls = new Hls();
    hls.loadSource(streamURL);
    hls.attachMedia(video);
  } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = streamURL;
  }

  // Autoplay smart (coba dengan suara → jika gagal → mute & play)
  video.addEventListener("loadedmetadata", async () => {
    if (config.autoplay) {
      try {
        await player.play();
      } catch (e) {
        player.muted = true;
        video.muted = true;
        player.play();
      }
    }
  });

});
</script>

</body>
</html>
