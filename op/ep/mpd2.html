<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>TipiStream DASH Player</title>

<!-- Shaka Player -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.js"></script>

<!-- Icons -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial, Helvetica, sans-serif;
}

/* PLAYER WRAPPER */
.player-container{
    position:relative;
    width:100%;
    height:100%;
    background:#000;
}

/* VIDEO */
video{
    width:100%;
    height:100%;
    object-fit:cover;
    background:#000;
}

/* TOP OVERLAY */
.top-bar{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    padding:20px;
    z-index:20;

    background:linear-gradient(to bottom,
    rgba(0,0,0,0.75),
    transparent);

    display:flex;
    justify-content:space-between;
    align-items:center;
}

/* LOGO */
.logo{
    display:flex;
    align-items:center;
    gap:10px;
    color:white;
    font-size:22px;
    font-weight:bold;
}

.logo i{
    color:#ff0000;
}

/* LIVE BADGE */
.live-badge{
    background:red;
    color:white;
    padding:7px 15px;
    border-radius:50px;
    font-size:14px;
    font-weight:bold;
    animation:pulse 1.5s infinite;
}

@keyframes pulse{
    0%{opacity:1;}
    50%{opacity:.5;}
    100%{opacity:1;}
}

/* CENTER BUTTON */
.center-play{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    z-index:20;

    width:90px;
    height:90px;
    border-radius:50%;

    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(10px);

    display:flex;
    justify-content:center;
    align-items:center;

    cursor:pointer;
    transition:.3s;
}

.center-play:hover{
    transform:translate(-50%,-50%) scale(1.1);
}

.center-play i{
    color:white;
    font-size:35px;
}

/* BOTTOM CONTROLS */
.bottom-bar{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;

    padding:20px;

    z-index:20;

    background:linear-gradient(to top,
    rgba(0,0,0,0.8),
    transparent);

    display:flex;
    justify-content:space-between;
    align-items:center;
}

/* LEFT CONTROLS */
.controls-left,
.controls-right{
    display:flex;
    align-items:center;
    gap:20px;
}

.control-btn{
    color:white;
    font-size:20px;
    cursor:pointer;
    transition:.3s;
}

.control-btn:hover{
    color:red;
}

/* TITLE */
.video-title{
    color:white;
    font-size:16px;
    font-weight:bold;
}

/* LOADING */
.loading{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);

    width:80px;
    height:80px;

    border:5px solid rgba(255,255,255,.2);
    border-top:5px solid red;
    border-radius:50%;

    animation:spin 1s linear infinite;

    z-index:30;
}

@keyframes spin{
    100%{
        transform:translate(-50%,-50%) rotate(360deg);
    }
}

/* HIDE */
.hidden{
    display:none;
}

/* MOBILE */
@media(max-width:768px){

    .top-bar,
    .bottom-bar{
        padding:15px;
    }

    .logo{
        font-size:18px;
    }

    .control-btn{
        font-size:18px;
    }

    .center-play{
        width:70px;
        height:70px;
    }
}

</style>
</head>

<body>

<div class="player-container">

    <!-- VIDEO -->
    <video id="video" autoplay playsinline></video>

    <!-- LOADING -->
    <div class="loading" id="loading"></div>

    <!-- TOP -->
    <div class="top-bar">

        <div class="logo">
            <i class="fa-solid fa-play"></i>
            <span>TipiStream</span>
        </div>

        <div class="live-badge">
            LIVE
        </div>

    </div>

    <!-- CENTER PLAY -->
    <div class="center-play" id="playBtn">
        <i class="fa-solid fa-play"></i>
    </div>

    <!-- BOTTOM -->
    <div class="bottom-bar">

        <div class="controls-left">

            <div class="control-btn" id="muteBtn">
                <i class="fa-solid fa-volume-high"></i>
            </div>

            <div class="video-title">
                DASH DRM Protected Stream
            </div>

        </div>

        <div class="controls-right">

            <div class="control-btn" id="fullscreenBtn">
                <i class="fa-solid fa-expand"></i>
            </div>

        </div>

    </div>

</div>

<script>

const video = document.getElementById('video');

const playBtn = document.getElementById('playBtn');

const muteBtn = document.getElementById('muteBtn');

const fullscreenBtn = document.getElementById('fullscreenBtn');

const loading = document.getElementById('loading');

/* INSTALL POLYFILLS */
shaka.polyfill.installAll();

if (shaka.Player.isBrowserSupported()) {

    initPlayer();

} else {

    alert('Browser not supported');

}

/* INIT PLAYER */
async function initPlayer(){

    const player = new shaka.Player(video);

    /* DRM CLEARKEY */
    player.configure({

        drm: {

            clearKeys: {

                '294b5761cefc22d0c6312939e13d8278':
                '52148f1042d238849f0a7813f1da8a7b'

            }

        }

    });

    /* ERROR HANDLER */
    player.addEventListener('error', onErrorEvent);

    try {

        await player.load(
        'https://otte.cache.aiv-cdn.net/bom-nitro/live/dash/enc/cllekigzzn/out/v1/bd3b0c314fff4bb1ab4693358f3cd2d3/cenc.mpd'
        );

        console.log('Video loaded');

        loading.classList.add('hidden');

        video.play();

    } catch(error){

        console.error(error);

    }

}

/* ERROR */
function onErrorEvent(event){

    console.error('Error code', event.detail);

}

/* PLAY PAUSE */
playBtn.addEventListener('click', () => {

    if(video.paused){

        video.play();

        playBtn.innerHTML =
        '<i class="fa-solid fa-pause"></i>';

    }else{

        video.pause();

        playBtn.innerHTML =
        '<i class="fa-solid fa-play"></i>';

    }

});

/* MUTE */
muteBtn.addEventListener('click', () => {

    video.muted = !video.muted;

    if(video.muted){

        muteBtn.innerHTML =
        '<i class="fa-solid fa-volume-xmark"></i>';

    }else{

        muteBtn.innerHTML =
        '<i class="fa-solid fa-volume-high"></i>';

    }

});

/* FULLSCREEN */
fullscreenBtn.addEventListener('click', () => {

    if(!document.fullscreenElement){

        document.documentElement.requestFullscreen();

    }else{

        document.exitFullscreen();

    }

});

/* AUTO HIDE PLAY BUTTON */
video.addEventListener('play', () => {

    setTimeout(() => {

        playBtn.style.opacity = '0';

    }, 1500);

});

video.addEventListener('pause', () => {

    playBtn.style.opacity = '1';

});

</script>

</body>
</html>
