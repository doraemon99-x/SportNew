<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TipiStream JW Player</title>

<!-- JW PLAYER - ganti SAHhwOAi dengan license key kamu -->
<script src="https://cdn.jwplayer.com/libraries/SAHhwOAi.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif;}

#player-wrapper{
  position:relative;
  width:100%;
  height:100vh;
}

#player{
  width:100%;
  height:100%;
}

.top-bar{
  position:absolute;
  top:0;left:0;
  width:100%;
  padding:20px;
  z-index:20;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:linear-gradient(to bottom,rgba(0,0,0,0.8),transparent);
  pointer-events:none;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  color:white;
  font-size:22px;
  font-weight:bold;
}

.logo .icon{
  color:red;
  font-size:26px;
}

.live-badge{
  background:red;
  color:white;
  padding:8px 16px;
  border-radius:50px;
  font-size:14px;
  font-weight:bold;
  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  0%{opacity:1;}
  50%{opacity:.5;}
  100%{opacity:1;}
}

@media(max-width:768px){
  .top-bar{padding:15px;}
  .logo{font-size:18px;}
  .live-badge{font-size:12px;padding:6px 12px;}
}
</style>
</head>
<body>

<div id="player-wrapper">

  <!-- JW Player akan render di sini -->
  <div id="player"></div>

  <!-- Top bar overlay (logo + live badge) -->
  <div class="top-bar">
    <div class="logo">
      <span class="icon">&#9654;</span>
      <span>TipiStream</span>
    </div>
    <div class="live-badge">LIVE</div>
  </div>

</div>

<script>
jwplayer("player").setup({

  // Info
  title: "Jangan Lupa Traktir Kopi",

  // Tampilan
  autostart: true,
  mute: false,
  stretching: "fill",
  width: "100%",
  height: "100%",

  // Stream + DRM ClearKey
  sources: [{
    file: "https://otte.cache.aiv-cdn.net/bom-nitro/live/dash/enc/cllekigzzn/out/v1/bd3b0c314fff4bb1ab4693358f3cd2d3/cenc.mpd",
    type: "application/dash+xml",
    drm: {
      clearkey: {
        keyId: "294b5761cefc22d0c6312939e13d8278",
        key:   "52148f1042d238849f0a7813f1da8a7b"
      }
    }
  }],

  // Sembunyikan logo JW
  logo: {
    hide: true
  },

  // Skin
  skin: {
    name: "netflix"
  }

});

// Event Handlers
jwplayer("player").on("ready", function(){
  console.log("Player siap.");
});

jwplayer("player").on("error", function(e){
  console.error("Error:", e.message);
});

jwplayer("player").on("bufferFull", function(){
  console.log("Buffer penuh, siap putar.");
});
</script>

</body>
</html>
