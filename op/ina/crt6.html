<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clappr Dash Shaka Player</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/clappr/dash-shaka-playback@latest/dist/dash-shaka-playback.js"></script>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: black;
        }
        #player {
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
        }
    </style>
</head>
<body>
    <div id="player"></div>
    <script>
        // Clear Key DRM Configuration
        var clearKeyConfig = {
            "keys": {
                "41afa5ce1f058754b60e75d7b18d6fc8": "0ec58a10968ce216d47cb8b14a270417" // Replace with actual keys
            },
            "type": "temporary"
        };

        var player = new Clappr.Player({
            source: 'https://vid.tipiku.biz.id/cpr.mpd', // DASH Manifest URL
            parentId: '#player',
            autoPlay: true,
            mute: false,
            watermark: "/img/tipistreamnew.png",
            position: 'top-right',
            width: '100%',
            height: '100%',
            plugins: [DashShakaPlayback],
            shakaConfiguration: {
                preferredAudioLanguage: 'en', // Preferred audio language
                streaming: {
                    rebufferingGoal: 15, // Rebuffering goal in seconds
                },
                drm: {
                    clearKeys: clearKeyConfig.keys // Clear Key DRM configuration
                }
            },
            shakaOnBeforeLoad: function(shakaPlayer) {
                // Example of setting up a custom filter or networking behavior
                shakaPlayer.getNetworkingEngine().registerRequestFilter((type, request) => {
                    console.log('Custom networking filter applied', request);
                });
            }
        });
    </script>
</body>
</html>
