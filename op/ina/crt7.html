<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clappr Dash Shaka Player with Widevine DRM</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/clappr/dash-shaka-playback@latest/dist/dash-shaka-playback.js"></script>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: black;
        }
        #player {
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
        }
    </style>
</head>
<body>
    <div id="player"></div>
    <script>
        // Widevine DRM Configuration
        var widevineConfig = {
            licenseServerUrl: 'https://mew.tipiku.workers.dev/?id=17623', // Replace with your actual Widevine license server URL
            // You might need to include additional headers for authentication or security
        };

        var player = new Clappr.Player({
            source: 'https://vid.tipiku.biz.id/cpr.mpd', // DASH Manifest URL
            parentId: '#player',
            autoPlay: true,
            mute: false,
            watermark: "/img/tipistreamnew.png",
            position: 'top-right',
            width: '100%',
            height: '100%',
            plugins: [DashShakaPlayback],
            shakaConfiguration: {
                preferredAudioLanguage: 'en', // Preferred audio language
                streaming: {
                    rebufferingGoal: 15, // Rebuffering goal in seconds
                },
                drm: {
                    widevine: {
                        serverURL: widevineConfig.licenseServerUrl, // Widevine license server URL
                        // Additional configuration may be required based on the server setup
                    }
                }
            }
        });
    </script>
</body>
</html>
