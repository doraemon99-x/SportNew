<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,minimal-ui">
    <meta name="referrer" content="no-referrer">
    <title>TipiStream</title>
    <style type="text/css">
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        display: flex;
        background-color: black;
      }
      #mse {
        flex: auto;
      }

      /* Widget Overlay */
      #widget-overlay {
        position: absolute;
        bottom: 70px; /* Sesuaikan posisi jika perlu */
        left: 0;
        width: 100%;
        height: auto;
        z-index: 10000; /* Pastikan berada di atas video */
        pointer-events: none; /* Agar tidak mengganggu interaksi dengan elemen lain */
      }
    </style>
    <link rel="stylesheet" href="https://unpkg.byted-static.com/xgplayer/3.0.10/dist/index.min.css">
  </head>
  <body>
    <div id="mse"></div>

    <!-- Menyematkan Widget Overlay -->
    <iframe 
      id="widget-overlay" 
      src="https://stream.trakteer.id/running-text-default.html?rt_theme=default&rt_messages=Ayo+dukung+terus+%7Busername%7D+di+%7Btrlink%7D+dan+beri+semangat+Tim+Kebangganmu...&creator_name=tipistream&page_url=trakteer.id/Tipistream&mod=3&key=trstream-yvOAUf9Z6t5e7jt9qBUw&hash=zb8r4zrrg6v569an" 
      frameborder="0">
    </iframe>
    <div id="mse"></div>
    <script src="//unpkg.byted-static.com/xgplayer/3.0.10/dist/index.min.js" charset="utf-8"></script>
    <script src="//unpkg.byted-static.com/xgplayer-hls/3.0.10/dist/index.min.js" charset="utf-8"></script>
    <script type="text/javascript">
      new window.Player({
          "id": "mse",
          "url": "https://vid.tipiku.biz.id/br4",
          "isLive": "true",
          "autoplay": "true",
          "fluid": "true",
          "pip": "true",
          "x5-video-player-fullscreen": "true",
          "x5-video-orientation": "landscape",
          "playsinline": "true",
          height: window.innerHeight,
          width: window.innerWidth,
          plugins: [window.HlsJsPlugin]
      });
      player.getPlugin('fullscreen').changeFullScreen()

      // Observasi ukuran untuk menyesuaikan dengan tinggi layar
      const resizeObserver = new ResizeObserver(() => {
        document.getElementById('mse').style.height = document.body.clientHeight + 'px';
      });
      resizeObserver.observe(document.body);
    </script>
  </body>
</html>
