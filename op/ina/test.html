<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clappr HLS Player</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
    <!--
    THIS PLUGIN IS ALSO COMPATIBLE WITH CLAPPR-CORE
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@clappr/core@latest/dist/clappr-core.min.js"></script>
    --->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/flv.js@latest/dist/flv.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/clappr-flvjs-playback@latest/dist/clappr-flvjs-playback.min.js"></script>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: black;
        }
        #player {
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
        }
    </style>
</head>
<body>
    <div id="player"></div>

    <script>
        const player = new Clappr.Player({
            source: 'https://vid.tipiku.biz.id/cfv.flv',
            mimeType: 'video/flv',
            plugins: [ FLVJSPlayback ],
            parentId: '#player',
            autoPlay: true,
            mute: false,
            watermark: "/img/tipistreamnew.png",
            position: 'top-right',
            height: '100%',
            width: '100%',
            playback: {
                playInline: true, // Untuk memutar video di dalam elemen
                flvjsConfig: {
                    enableLogging: true, // default is "false"
                    // // Params from flv.js
                    }
            },
            poster: 'https://i.postimg.cc/3NLwz2zj/banntipistream.png', // Tambahkan gambar jika diperlukan (opsional)
        });
    </script>
</body>
</html>
