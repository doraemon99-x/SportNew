<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.jsdelivr.net/npm/flv.js@latest/dist/flv.min.js"></script>

  <style>
    html, body {
        height: 100%;
        width: 100%;
        padding: 0;
        margin: 0;
        background: black;
        overflow: hidden;
    }

    .player {
        height: 100%;
        width: 100%;
        object-fit: contain;
        background: black;
    }

    /* Overlay widget */
    #widget-overlay {
        position: absolute;
        bottom: 70px;
        left: 0;
        width: 100%;
        z-index: 9999;
        pointer-events: none;
        text-align: center;
        color: white;
    }
  </style>
</head>

<body>

  <video id="video" class="player" controls autoplay></video>

  <div id="widget-overlay"></div>

  <script>
    const params = new URLSearchParams(window.location.search)
    const stream = params.get("url") || "http://live3.procdnlive.com/livecdn/channel80.flv"

    if (flvjs.isSupported()) {
      const player = flvjs.createPlayer({
        type: 'flv',
        url: '/flv?url=' + encodeURIComponent(stream),
        isLive: true
      })

      const video = document.getElementById('video')
      player.attachMediaElement(video)
      player.load()
      player.play()

      // Auto reconnect
      player.on(flvjs.Events.ERROR, () => {
        player.unload()
        player.load()
        player.play()
      })
    }
  </script>

</body>
</html>
