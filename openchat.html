<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Cloudflare Worker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        #response {
            margin-top: 20px;
            border: 1px solid #ccc;
            padding: 10px;
            height: 200px;
            overflow-y: scroll;
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
    <h1>Test Cloudflare Worker</h1>
    <button id="fetchButton">Fetch AI Responses</button>
    <div id="response"></div>

    <script>
        document.getElementById('fetchButton').addEventListener('click', async () => {
            try {
                const response = await fetch('https://apasih.tipiku.workers.dev/', {
                    method: 'GET',
                });

                const jsonResponse = await response.json();
                displayResponses(jsonResponse);
            } catch (error) {
                appendToResponse(`Error: ${error.message}\n`);
            }
        });

        function displayResponses(data) {
            data.forEach(task => {
                appendToResponse(`Prompt: ${JSON.stringify(task.inputs)}\n`);
                appendToResponse(`Response: ${JSON.stringify(task.response)}\n`);
            });
        }

        function appendToResponse(text) {
            const responseDiv = document.getElementById('response');
            responseDiv.innerText += text + '\n';
            responseDiv.scrollTop = responseDiv.scrollHeight; // Scroll to bottom
        }
    </script>
</body>
</html>
