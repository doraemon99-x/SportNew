<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Interface</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        #chat-container {
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 10px;
            background: white;
            max-width: 600px;
            margin: auto;
            overflow-y: auto;
            height: 400px;
        }
        #chat-log {
            max-height: 350px;
            overflow-y: auto;
        }
        .message {
            margin: 5px 0;
            padding: 8px;
            border-radius: 4px;
        }
        .user {
            background-color: #d1e7dd;
            text-align: right;
        }
        .assistant {
            background-color: #f8d7da;
            text-align: left;
        }
        input[type="text"] {
            width: 80%;
            padding: 10px;
            margin-right: 10px;
        }
        button {
            padding: 10px;
        }
    </style>
</head>
<body>

<h2>AI Chat Interface</h2>
<div id="chat-container">
    <div id="chat-log"></div>
</div>
<input type="text" id="user-input" placeholder="Type your message here...">
<button id="send-button">Send</button>

<script>
    const chatLog = document.getElementById('chat-log');
    const userInput = document.getElementById('user-input');
    const sendButton = document.getElementById('send-button');

    const workerUrl = 'https://apasih.tipiku.workers.dev/'; // Ganti dengan URL Worker Anda

    sendButton.addEventListener('click', async () => {
        const message = userInput.value.trim();
        if (!message) return;

        // Tampilkan pesan pengguna di chat log
        appendMessage(message, 'user');

        // Kirim pesan ke Worker
        const messages = [
            { role: 'system', content: 'You are a helpful assistant.' },
            { role: 'user', content: message }
        ];

        try {
            const response = await fetch(workerUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ messages })
            });

            if (!response.ok) {
                throw new Error('Network response was not ok');
            }

            const data = await response.json();
            const assistantMessage = data.choices[0].message.content;
            appendMessage(assistantMessage, 'assistant');
        } catch (error) {
            appendMessage('Error: ' + error.message, 'assistant');
        }

        // Clear input
        userInput.value = '';
    });

    function appendMessage(content, sender) {
        const messageDiv = document.createElement('div');
        messageDiv.classList.add('message', sender);
        messageDiv.textContent = content;
        chatLog.appendChild(messageDiv);
        chatLog.scrollTop = chatLog.scrollHeight; // Scroll ke bawah
    }
</script>

</body>
</html>
