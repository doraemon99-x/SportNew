<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with AI</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }
        #nav-logo {
            text-align: center;
            margin: 20px 0;
        }
        #nav-logo img {
            max-width: 150px; /* Atur ukuran logo */
            height: auto;
        }
        #chat-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        #chat-log {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            border-bottom: 1px solid #ccc;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        .message {
            margin: 10px 0;
            padding: 12px;
            border-radius: 8px;
            max-width: 75%;
        }
        .system {
            background-color: #d1e7dd;
            align-self: flex-start;
            border: 1px solid #b5e3b5;
        }
        .code {
            background-color: #f8f9fa;
            border: 1px solid #ced4da;
            border-radius: 4px;
            padding: 10px;
            overflow-x: auto;
            font-family: 'Courier New', Courier, monospace;
            white-space: pre-wrap; /* Mendukung pemformatan yang lebih baik */
        }
        #user-input {
            display: flex;
            padding: 10px;
            background-color: #fff;
            border-top: 1px solid #ccc;
        }
        #user-input input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-right: 10px;
        }
        #send-button {
            padding: 12px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        #send-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div id="nav-logo">
    <img src="/img/tipigaza.png" alt="Logo">
</div>

<div id="chat-container">
    <div id="chat-log"></div>
    <div id="user-input">
        <input type="text" id="user-message" placeholder="Ketik pesan Anda di sini..." />
        <button id="send-button">Kirim</button>
    </div>
</div>

<script>
    const chatLog = document.getElementById('chat-log');
    const userMessageInput = document.getElementById('user-message');
    const sendButton = document.getElementById('send-button');

    sendButton.addEventListener('click', async () => {
        const userMessage = userMessageInput.value;
        if (!userMessage) return;

        // Menampilkan pesan pengguna
        userMessageInput.value = '';

        try {
            const response = await fetch('https://apasih.tipiku.workers.dev/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    messages: [
                        { role: 'user', content: userMessage }
                    ]
                }),
            });

            const data = await response.json();
            
            // Filter hanya role 'system'
            data.response.messages.forEach(message => {
                if (message.role === 'system') {
                    appendMessage(message.content, 'system');
                }
            });

        } catch (error) {
            console.error('Error:', error);
        }
    });

    function appendMessage(content, role) {
        const messageDiv = document.createElement('div');
        messageDiv.classList.add('message', role);

        if (role === 'system' && content.startsWith('```') && content.endsWith('```')) {
            // Jika konten merupakan kode
            const codeBlock = document.createElement('pre');
            const codeContent = content.slice(3, -3); // Menghilangkan tanda ```
            codeBlock.classList.add('code');
            codeBlock.textContent = codeContent;
            messageDiv.appendChild(codeBlock);
        } else {
            messageDiv.textContent = content;
        }

        chatLog.appendChild(messageDiv);
        chatLog.scrollTop = chatLog.scrollHeight; // Scroll ke bawah
    }
</script>

</body>
</html>
