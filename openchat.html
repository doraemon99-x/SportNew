<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with AI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        #nav-logo {
            text-align: center;
            margin-bottom: 20px;
        }
        #nav-logo img {
            max-width: 100%; /* Responsif */
            height: auto;
        }
        #chat-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        #chat-log {
            height: 400px;
            overflow-y: scroll;
            padding: 10px;
            border-bottom: 1px solid #ccc;
        }
        .message {
            margin: 5px 0;
            padding: 8px;
            border-radius: 4px;
        }
        .user {
            background-color: #d1e7dd;
            text-align: right;
        }
        .assistant {
            background-color: #f8d7da;
            text-align: left;
        }
        #user-input {
            display: flex;
            padding: 10px;
        }
        #user-input input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        #send-button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            margin-left: 10px;
            cursor: pointer;
        }
        #send-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div id="nav-logo">
    <img src="/img/tipigaza.png" alt="Logo">
</div>

<div id="chat-container">
    <div id="chat-log"></div>
    <div id="user-input">
        <input type="text" id="user-message" placeholder="Ketik pesan Anda di sini..." />
        <button id="send-button">Kirim</button>
    </div>
</div>

<script>
    const chatLog = document.getElementById('chat-log');
    const userMessageInput = document.getElementById('user-message');
    const sendButton = document.getElementById('send-button');

    sendButton.addEventListener('click', async () => {
        const userMessage = userMessageInput.value;
        if (!userMessage) return;

        // Menampilkan pesan pengguna
        appendMessage(userMessage, 'user');
        userMessageInput.value = '';

        try {
            const response = await fetch('https://apasih.tipiku.workers.dev/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    messages: [
                        { role: 'user', content: userMessage }
                    ]
                }),
            });

            const data = await response.json();
            const assistantMessage = data.response; // Sesuaikan dengan format respons dari Worker Anda
            
            // Menampilkan pesan asisten
            appendMessage(assistantMessage, 'assistant');
        } catch (error) {
            console.error('Error:', error);
        }
    });

    function appendMessage(content, role) {
        const messageDiv = document.createElement('div');
        messageDiv.classList.add('message', role);
        messageDiv.textContent = content;
        chatLog.appendChild(messageDiv);
        chatLog.scrollTop = chatLog.scrollHeight; // Scroll ke bawah
    }
</script>

</body>
</html>
