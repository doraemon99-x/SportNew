<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Chat with Cloudflare Worker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        #response {
            margin-top: 20px;
            border: 1px solid #ccc;
            padding: 10px;
            height: 300px;
            overflow-y: scroll;
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
    <h1>Chat with AI</h1>
    <textarea id="inputMessage" rows="4" cols="50" placeholder="Type your message here..."></textarea><br>
    <button id="sendButton">Send</button>
    <div id="response"></div>

    <script>
        document.getElementById('sendButton').addEventListener('click', async () => {
            const inputMessage = document.getElementById('inputMessage').value;

            // Clear the input field
            document.getElementById('inputMessage').value = '';

            // Display the message in the response area
            appendToResponse(`You: ${inputMessage}\n`);

            // Prepare the message payload
            const messages = [
                { role: 'user', content: inputMessage }
            ];

            try {
                const response = await fetch('https://apasih.tipiku.workers.dev/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ messages })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let result = '';

                // Read the response stream
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    result += decoder.decode(value, { stream: true });
                    // Process the streamed data
                    processStreamedData(result);
                }
            } catch (error) {
                appendToResponse(`Error: ${error.message}\n`);
            }
        });

        function processStreamedData(data) {
            const lines = data.split('\n');
            lines.forEach(line => {
                if (line.startsWith('data:')) {
                    const json = line.replace('data: ', '');
                    if (json !== '[DONE]') {
                        try {
                            const parsed = JSON.parse(json);
                            appendToResponse(`AI: ${parsed.response}\n`);
                        } catch (e) {
                            console.error('Error parsing JSON:', e);
                        }
                    }
                }
            });
        }

        function appendToResponse(text) {
            const responseDiv = document.getElementById('response');
            responseDiv.innerText += text;
            responseDiv.scrollTop = responseDiv.scrollHeight; // Scroll to bottom
        }
    </script>
</body>
</html>
