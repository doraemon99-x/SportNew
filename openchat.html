<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat dengan AI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        #chat-container {
            border: 1px solid #ccc;
            padding: 10px;
            height: 300px;
            overflow-y: scroll;
            margin-bottom: 10px;
        }
        #user-input {
            width: calc(100% - 20px);
            padding: 10px;
            margin-bottom: 10px;
        }
        #send-button {
            padding: 10px 20px;
        }
    </style>
</head>
<body>
    <h1>Chat dengan AI</h1>
    <div id="chat-container"></div>
    <input type="text" id="user-input" placeholder="Ketik pesan Anda...">
    <button id="send-button">Kirim</button>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');

        sendButton.addEventListener('click', async () => {
            const message = userInput.value;
            if (!message) return;

            // Tampilkan pesan pengguna
            chatContainer.innerHTML += `<div><strong>Anda:</strong> ${message}</div>`;
            userInput.value = '';

            // Kirim pesan ke Worker
            const response = await fetch('https://apasih.tipiku.workers.dev/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    messages: [
                        { role: 'user', content: message }
                    ]
                })
            });

            // Tangani respons dari Worker
            const data = await response.json();
            chatContainer.innerHTML += `<div><strong>AI:</strong> ${data.response}</div>`;

            // Scroll ke bawah untuk menampilkan pesan terbaru
            chatContainer.scrollTop = chatContainer.scrollHeight;
        });
    </script>
</body>
</html>
