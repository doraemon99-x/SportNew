<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <title>Nonton Sport 2024</title>
    <link rel="stylesheet" type="text/css" href="/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://cdn.jsdelivr.net/npm/disable-devtool"></script>
    <script>
        DisableDevtool({
            ondevtoolopen: (type) => {
                const info = 'Ngapain bg?'
                alert(info); // If you are worried about blocking the page, use console.warn(info); and open the console to view
            },
        })
    </script>
</head>
<body>
    <div id="nav-logo">
        <img src="/img/tipigaza.png" alt="Logo">
    </div>

    <iframe id="content-frame" src="https://stream.trakteer.id/running-text-default.html?rt_theme=default&rt_messages=Ayo+dukung+terus+%7Busername%7D+di+%7Btrlink%7D+dan+beri+semangat+Tim+Kebangganmu...&creator_name=tipistream&page_url=trakteer.id/Tipistream&mod=3&key=trstream-yvOAUf9Z6t5e7jt9qBUw&hash=zb8r4zrrg6v569andefault&rt_messages=Ayo+dukung+terus+%7Busername%7D+di+%7Btrlink%7D+dan+beri+semangat+Tim+Kebangganmu...&creator_name=tipistream&page_url=trakteer.id/Tipistream&mod=3&key=trstream-yvOAUf9Z6t5e7jt9qBUw&hash=zb8r4zrrg6v569an" style="border: solid 1px #A6A6A6" allowFullScreen="true" loading="lazy"></iframe>

    <div id="info-container">
        <div id="clock-container">
            <span id="clock"></span>
        </div>
        <div id="marquee-container">
            <marquee id="marquee-text">Gunakan DNS 1.1.1.1/VPN jika tidak bisa play streaming. | Jangan Judi Teros Bang, Mending Traktir Mimin Kopi via Dana 085157386617, atau Klik pada logo TipiStream layar streaming. | .</marquee>
        </div>
    </div>      

    <div id="text-container">
        BADMINTON [TEST]
    </div>

    <div id="button-container">
        <div class="bottom-button" onclick="goToHome()">Refresh</div>
        <script>
            function goToHome() {
                window.location.replace("https://sport.tipiku.my.id/");
            }
        </script>
        <div class="bottom-button" onclick="loadContent('/op/bd/crt1')">Court 1</div>
        <div class="bottom-button" onclick="loadContent('/op/bd/crt2')">Court 2</div>
        <div class="bottom-button" onclick="loadContent('/op/bd/crt3')">Court 3</div>
        <div class="bottom-button" onclick="loadContent('/op/bd/crt4')">Court 4</div>
    </div>

    <iframe id="cbox-frame" src="https://www5.cbox.ws/box/?boxid=940426&boxtag=rSDm0Y" loading="lazy"></iframe>

    <div id="trakteer-container">
        <script type='text/javascript' src='https://assets.trakteer.id/js/trbtn-overlay.min.js'></script>
        <script type='text/javascript' class='troverlay'>
            (function() {
                var trbtnId = trbtnOverlay.init('Dukung TipiStream','#7B0961','https://trakteer.id/Tipistream/tip/embed/modal','https://trakteer.id/images/mix/coffee.png','40','inline');
                trbtnOverlay.draw(trbtnId);
            })();
        </script>
        <iframe src="https://stream.trakteer.id/top-supporter-default.html?ts_theme=default&ts_sortby=nominal&ts_interval=90&key=trstream-yvOAUf9Z6t5e7jt9qBUw&timestamp=1721611148" title="frame" name="name1" width="280px" height="200px" style="border: solid 0px #A6A6A6" loading="lazy"></iframe>
    </div>

    <script>
        function loadContent(url) {
            var iframe = document.getElementById('content-frame');
            iframe.src = url;
        }

        function updateClock() {
            var now = new Date();
            var time = now.toLocaleTimeString('id-ID', { timeZone: 'Asia/Jakarta', hour: '2-digit', minute: '2-digit' }) + " WIB";
            document.getElementById('clock').textContent = time;
        }

        setInterval(updateClock, 1000);
    </script>
</body>
</html>
