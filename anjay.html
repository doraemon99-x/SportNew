<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Fullscreen HLS Player</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #000;
      overflow: hidden;
    }

    /* Fullscreen video */
    #video {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: contain;   /* ganti ke cover kalau mau nge-zoom penuh */
      background: #000;
    }

    /* Small overlay (optional) */
    #overlay {
      position: fixed;
      left: env(safe-area-inset-left);
      right: env(safe-area-inset-right);
      bottom: calc(14px + env(safe-area-inset-bottom));
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
      padding: 0 12px;
      pointer-events: none;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
    }
    .chip {
      pointer-events: auto;
      font-size: 13px;
      color: #fff;
      background: rgba(0,0,0,.45);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 999px;
      padding: 8px 12px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    select, button {
      background: transparent;
      color: #fff;
      border: none;
      outline: none;
      cursor: pointer;
      font: inherit;
    }
    select option { color: #000; }
  </style>
</head>

<body>
  <video
    id="video"
    controls
    playsinline
    webkit-playsinline
    autoplay
  ></video>

  <!-- overlay kecil: status + quality -->
  <div id="overlay">
    <div class="chip"><span id="status">Loading...</span></div>
    <div class="chip">
      Quality:
      <select id="quality">
        <option value="-1">Auto</option>
      </select>
    </div>
    <div class="chip">
      <button id="fsBtn">Fullscreen</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    const video = document.getElementById("video");
    const statusEl = document.getElementById("status");
    const qualitySelect = document.getElementById("quality");
    const fsBtn = document.getElementById("fsBtn");

    // Ganti URL m3u8 di sini
    const STREAM_URL = "https://live.efarinatv.com/hls/bgtaufikganteng.m3u8";

    let hls = null;

    function setStatus(t) { statusEl.textContent = t; }

    function clearQualities() {
      qualitySelect.innerHTML = "";
      qualitySelect.append(new Option("Auto", "-1"));
    }

    async function requestFullscreen() {
      try {
        // iOS Safari punya API fullscreen sendiri
        if (video.webkitEnterFullscreen) {
          video.webkitEnterFullscreen();
          return;
        }
        if (document.fullscreenElement) return;
        await (video.requestFullscreen?.() || document.documentElement.requestFullscreen?.());
      } catch (e) {
        // beberapa browser butuh user gesture, jadi bisa gagal
        console.warn("Fullscreen blocked:", e);
      }
    }

    function destroyHls() {
      if (hls) {
        hls.destroy();
        hls = null;
      }
    }

    function loadStream(url) {
      setStatus("Loading...");
      clearQualities();
      destroyHls();

      // Native HLS (Safari/iOS)
      if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = url;
        video.addEventListener("loadedmetadata", () => {
          setStatus("Native HLS");
        }, { once: true });
        return;
      }

      if (!Hls.isSupported()) {
        setStatus("HLS not supported");
        return;
      }

      hls = new Hls({
        enableWorker: true,
        lowLatencyMode: true
      });

      hls.attachMedia(video);

      hls.on(Hls.Events.MEDIA_ATTACHED, () => {
        hls.loadSource(url);
      });

      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        setStatus("Hls.js Ready");

        // isi quality list
        (hls.levels || []).forEach((lvl, idx) => {
          const label = lvl.height ? `${lvl.height}p` : (lvl.bitrate ? `${Math.round(lvl.bitrate/1000)}kbps` : `Level ${idx}`);
          qualitySelect.append(new Option(label, String(idx)));
        });
      });

      hls.on(Hls.Events.ERROR, (_, data) => {
        console.error("HLS error:", data);
        setStatus(`Error: ${data.details || data.type}`);

        if (data.fatal) {
          switch (data.type) {
            case Hls.ErrorTypes.NETWORK_ERROR:
              hls.startLoad();
              break;
            case Hls.ErrorTypes.MEDIA_ERROR:
              hls.recoverMediaError();
              break;
            default:
              destroyHls();
              break;
          }
        }
      });
    }

    // Quality switch
    qualitySelect.addEventListener("change", () => {
      if (!hls) return;
      hls.currentLevel = Number(qualitySelect.value); // -1 = auto
      setStatus(qualitySelect.value === "-1" ? "Auto quality" : "Quality locked");
    });

    // Fullscreen button
    fsBtn.addEventListener("click", requestFullscreen);

    // Autoplay => langsung coba fullscreen setelah play (kalau dibolehkan)
    video.addEventListener("play", () => requestFullscreen(), { once: true });

    // tap video => fullscreen
    video.addEventListener("click", () => requestFullscreen());

    // start
    loadStream(STREAM_URL);
  </script>
</body>
</html>
